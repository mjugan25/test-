<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes histoires</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap">
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#3b2a5a;--acc:#ff7a59;--acc2:#7c5cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1633;--card:#2b2150;--ink:#fff3d6}}
:root[data-theme="dark"]{--bg:#1d1633;--card:#2b2150;--ink:#fff3d6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif}
h1{font-size:1.6rem;margin:.8rem 1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:0 14px 90px}
.card{aspect-ratio:3/4;border:0;border-radius:24px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:10px;color:#fff;font:inherit;box-shadow:0 6px 16px #0003}
.card .big{font-size:4.5rem;margin:auto}
.card b{background:#0007;border-radius:14px;padding:6px 10px;font-size:1rem;line-height:1.2}
.lock{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));border:0;background:var(--card);border-radius:50%;width:44px;height:44px;opacity:.5;font-size:1.2rem}
.top{display:flex;gap:10px;padding:10px 14px}
.ic{width:56px;height:56px;border-radius:50%;border:0;background:var(--card);font-size:1.6rem;box-shadow:0 3px 8px #0002}
.scene{font-size:5.5rem;text-align:center;padding:10px;min-height:150px;display:flex;align-items:center;justify-content:center}
.scene img{max-width:100%;max-height:38vh;border-radius:24px}
.ks{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.k{font-size:3.6rem;border:0;background:var(--card);border-radius:28px;width:96px;height:96px;box-shadow:0 5px 12px #0002}
.pop{animation:b .5s}
@keyframes b{50%{transform:scale(1.4) rotate(12deg)}}
.txt{font-size:1.35rem;line-height:1.5;padding:14px 20px;text-align:center}
.nav{display:flex;justify-content:space-around;align-items:center;padding:8px 14px 20px}
.nb{font-size:2.4rem;width:110px;height:76px;border:0;border-radius:38px;background:var(--acc);color:#fff;box-shadow:0 5px 12px #0003}
.nb:disabled{opacity:.25}
.box{max-width:480px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.box input,.box textarea{font:inherit;padding:10px;border-radius:12px;border:2px solid #0003;background:var(--card);color:var(--ink)}
.btn{background:var(--acc2);color:#fff;border:0;border-radius:14px;padding:12px;font:inherit;font-size:1.1rem}
.btn2{background:var(--card);color:var(--ink);border:2px solid #0003;border-radius:14px;padding:10px;font:inherit}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:8px 12px;border-radius:12px}
label{font-weight:700;font-size:.95rem}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const STORY0={id:"s0",title:"Margaux, Juliette et l’île aux nuages",emoji:"☁️",grad:["#ffd36e","#ff8fab"],pages:[
{s:"🏡🌙✨",k:[["⭐","Une étoile !",880],["🌙","La lune !",440]],t:"Ce soir, Margaux et sa petite sœur Juliette regardent par la fenêtre. Une étoile brille très fort et clignote : elle les appelle !"},
{s:"🌳🚪🌟",k:[["🚪","Toc toc toc !",523],["🌟","Ça brille !",988]],t:"Dans le jardin, une minuscule porte dorée est apparue. Margaux prend Juliette par la main : « Viens, on va voir ! » Juliette fait un grand sourire."},
{s:"☁️🌈☁️",k:[["☁️","Pouf, un nuage !",392],["🌈","Un arc-en-ciel !",659]],t:"Tic ! La porte s’ouvre et un gros nuage tout moelleux les emporte dans le ciel. Whouiii ! Elles glissent sur l’arc-en-ciel jusqu’à l’île aux nuages."},
{s:"🐉😢",k:[["🐉","Rrrou !",330],["💧","Snif snif",294]],t:"Là, un tout petit dragon pleure. Il a perdu son feu magique ! « Ne pleure pas, dit Margaux, on va t’aider. »"},
{s:"👏🔥🐉",k:[["👏","Clap clap !",784],["🔥","Ouaaah !",698]],t:"Alors Juliette tape dans ses petites mains : « Ba-ba ! » Clap, clap ! Le dragon éclate de rire, et pouf ! Une petite flamme douce qui sent la brioche revient. Hourra !"},
{s:"🏡🌙😴",k:[["🌙","Bonne nuit",262],["💤","Zzz…",220]],t:"Le dragon les ramène à la maison sur son nuage. Margaux et Juliette se glissent sous la couette. Demain, une nouvelle aventure les attend. Bonne nuit, les aventurières !"}
]};

/* stockage local (IndexedDB) pour les histoires ajoutées par le parent */
const db=new Promise((ok,ko)=>{const r=indexedDB.open("histoires",1);r.onupgradeneeded=()=>r.result.createObjectStore("s",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const tx=async(m,f)=>{const d=await db;return new Promise((ok,ko)=>{const t=d.transaction("s",m),q=f(t.objectStore("s"));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>ko(t.error)})};
const all=()=>tx("readonly",s=>s.getAll()).then(r=>r||[]).catch(()=>[]);
const put=o=>tx("readwrite",s=>s.put(o));
const del=id=>tx("readwrite",s=>s.delete(id));

/* voix, sons, audio */
let au=null,story=null,page=0,voice=true;
function stop(){try{speechSynthesis.cancel()}catch(e){}if(au){au.pause();au=null}}
function say(t){if(!voice||!t||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.85;u.pitch=1.15;setTimeout(()=>speechSynthesis.speak(u),120)}
function beep(f){try{const c=beep.c||(beep.c=new(window.AudioContext||window.webkitAudioContext)()),o=c.createOscillator(),g=c.createGain();c.resume&&c.resume();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.4)}catch(e){}}

/* écran enfant : accueil */
async function home(){
  stop();const mine=await all(),list=[STORY0,...mine];
  app.innerHTML=`<h1>📖 Mes histoires</h1><div class="grid">${list.map((s,i)=>{
    const bg=s.cover?`center/cover url('${URL.createObjectURL(s.cover)}')`:`linear-gradient(135deg,${(s.grad||["#7ad7ff","#c9a7ff"]).join(",")})`;
    return `<button class="card" data-i="${i}" style="background:${bg}">${s.cover?"":`<span class="big">${s.emoji||"📚"}</span>`}<b>${esc(s.title)}</b></button>`}).join("")}</div><button class="lock" id="par">🔒</button>`;
  app.querySelectorAll(".card").forEach(b=>b.onclick=()=>{story=list[b.dataset.i];page=0;view()});
  $("#par").onclick=gate;
}

/* écran enfant : lecture */
function view(){
  const s=story,pg=s.pages[page],last=page==s.pages.length-1;
  const scene=s.cover?`<img src="${URL.createObjectURL(s.cover)}" alt="">`:(pg.s||s.emoji||"📖");
  app.innerHTML=`<div class="top"><button class="ic" id="h">🏠</button><button class="ic" id="v">${voice?"🔊":"🔇"}</button>${s.audio?'<button class="ic" id="pl">▶️</button>':'<button class="ic" id="rd">🗣️</button>'}</div>
  <div class="scene">${scene}</div>
  <div class="ks">${(pg.k||[]).map((k,i)=>`<button class="k" data-i="${i}">${k[0]}</button>`).join("")}</div>
  <p class="txt">${esc(pg.t||"")}</p>
  <div class="nav"><button class="nb" id="pv" ${page?"":"disabled"}>⬅️</button><span>${page+1}/${s.pages.length}</span><button class="nb" id="nx">${last?"🏠":"➡️"}</button></div>`;
  $("#h").onclick=home;
  $("#v").onclick=()=>{voice=!voice;if(!voice)speechSynthesis.cancel();view()};
  $("#pv").onclick=()=>{page--;view()};const rd=$("#rd");if(rd)rd.onclick=()=>{const v=voice;voice=true;say(pg.t);voice=v};
  $("#nx").onclick=()=>last?home():(page++,view());
  const pl=$("#pl");
  if(pl)pl.onclick=()=>{if(au&&!au.paused){au.pause();pl.textContent="▶️"}else{au=au||new Audio(URL.createObjectURL(s.audio));au.onended=()=>pl.textContent="▶️";au.play();pl.textContent="⏸️"}};
  app.querySelectorAll(".k").forEach(b=>b.onclick=()=>{const k=pg.k[b.dataset.i];b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");beep(k[2]);say(k[1])});
  if(!s.audio)say(pg.t);
}

/* espace parent */
function gate(){
  const a=2+Math.floor(Math.random()*8),b=3+Math.floor(Math.random()*6);
  app.innerHTML=`<div class="box"><h2>🔒 Espace parent</h2><p>Combien font ${a} × ${b} ?</p><input id="r" inputmode="numeric"><button class="btn" id="ok">Valider</button><button class="btn2" id="bk">Retour</button></div>`;
  $("#ok").onclick=()=>+$("#r").value===a*b?parent():alert("Ce n’est pas ça");
  $("#bk").onclick=home;
}
async function parent(){
  const mine=await all();
  app.innerHTML=`<div class="box"><h2>Ajouter une histoire</h2>
  <label>Titre</label><input id="ti">
  <label>Image de couverture</label><input id="cv" type="file" accept="image/*">
  <label>Son / voix (fichier audio)</label><input id="ad" type="file" accept="audio/*">
  <label>Texte (une page = un paragraphe, séparés par une ligne vide)</label><textarea id="tx" rows="6"></textarea>
  <button class="btn" id="sv">Enregistrer</button>
  <h3>Mes histoires ajoutées</h3>
  ${mine.map(s=>`<div class="row"><span>${esc(s.title)}</span><button class="btn2" data-d="${s.id}">Supprimer</button></div>`).join("")||"<p>Aucune pour l’instant.</p>"}
  <button class="btn2" id="bk">Retour</button></div>`;
  $("#bk").onclick=home;
  app.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Supprimer cette histoire ?")){await del(b.dataset.d);parent()}});
  $("#sv").onclick=async()=>{
    const t=$("#ti").value.trim();if(!t)return alert("Ajoute un titre");
    const tx=$("#tx").value.trim(),pages=(tx?tx.split(/\n\s*\n/):[""]).map(p=>({t:p.trim()}));
    try{await put({id:"u"+Date.now(),title:t,cover:$("#cv").files[0]||null,audio:$("#ad").files[0]||null,pages})}
    catch(e){return alert("Enregistrement impossible sur cet appareil")}
    home();
  };
}
home();
</script>
</body>
</html>
